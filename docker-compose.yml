version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: eval_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: eval_db
    ports:
      - "5432:5432"
    volumes:
      - ./:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
